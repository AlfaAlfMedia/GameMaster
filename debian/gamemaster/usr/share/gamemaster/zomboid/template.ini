# Players can injure other players.
PVP=true

# Log PvP events to the admin chat.
PVPLogToolChat=true

# Log PvP events to a file.
PVPLogToolFile=true

# Freeze in-game time while no player is connected.
PauseEmpty=true

# Enable or disable the global chat channel.
GlobalChat=true

# Chat channels available to players, comma separated.
ChatStreams=s,r,a,w,y,sh,f,all

# Allow unregistered players to connect.
Open=true

# First message shown in the chat panel after a player logs in.
# Use <RGB:1,0,0> for coloured text and <LINE> (written without the space) for a line break.
ServerWelcomeMessage=Welcome to Project Zomboid Multiplayer! <LINE> <LINE> To interact with the Chat panel: press Tab, T, or Enter. <LINE> <LINE> The Tab key will change the target stream of the message. <LINE> <LINE> Global Streams: /all <LINE> Local Streams: /say, /yell <LINE> Special Steams: /whisper, /safehouse, /faction. <LINE> <LINE> Press the Up arrow to cycle through your message history. Click the Gear icon to customize chat. <LINE> <LINE> Happy surviving!

# Show the user name above player characters.
DisplayUserName=true

# Show first and last name above player characters.
ShowFirstAndLastName=false

UsernameDisguises=false

HideDisguisedUserName=false

SwitchZombiesOwnershipEachUpdate=false

# Spawn every new player at the world coordinates 'x,y,z'. Ignored when set to 0,0,0.
SpawnPoint=0,0,0

# Players can enter and leave PvP mode individually. A player can only be injured
# while one or both sides are in PvP mode.
SafetySystem=true

# Show a skull icon above players who are in PvP mode.
ShowSafety=true

# Seconds a player needs to enter or leave PvP mode. Min=0 Max=1000 Default=2
SafetyToggleTimer=2

# Cooldown in seconds before PvP mode can be toggled again. Min=0 Max=1000 Default=3
SafetyCooldownTimer=3

# Min=0 Max=60 Default=60
SafetyDisconnectDelay=60

# Items new players spawn with, comma separated. Example: Base.Axe, Base.BigHikingBag
SpawnItems=

# UDP port clients connect to. Min=0 Max=65535 Default=16261
DefaultPort=16261

# Min=0 Max=65535 Default=16262
UDPPort=16262

# Changed by a soft reset. Changing it deletes the client save files,
# but not the client player files. Min=0 Max=2147483647 Default=350406683
ResetID=7728971

# Mod load IDs. Found in \\Steam\\steamapps\\workshop\\modID\\mods\\modName\\info.txt
Mods=

# Map folder name. Found in \\Steam\\steamapps\\workshop\\modID\\mods\\modName\\media\\maps\\
Map=Muldraugh, KY

# Kick players whose game files do not match the server's.
DoLuaChecksum=true

DenyLoginOnOverloadedServer=true

# List the server in the in-game server browser. Steam-enabled servers also appear
# in the Steam server browser.
Public=false

# Name shown in the server browser.
PublicName=My PZ Server

# Description shown in the server browser.
PublicDescription=

# Maximum number of simultaneous players, admins not counted.
# WARNING: more than 32 players can cause poor map streaming and desync.
# Min=1 Max=254 Default=32
MaxPlayers=32

# Ping in milliseconds above which a player is kicked. 0 disables the check.
# Min=0 Max=2147483647 Default=0
PingLimit=0

# Loot does not respawn in buildings claimed as a safehouse.
SafehousePreventsLootRespawn=true

# Remove the account from the whitelist on death, preventing a new character.
DropOffWhiteListAfterDeath=false

# Disable all fire except campfires.
NoFire=false

# Post a chat message whenever a player dies.
AnnounceDeath=false

# Post a chat message whenever an animal dies.
AnnounceAnimalDeath=false

# Save loaded map chunks after this many real-life minutes. Normally the map is
# saved once players leave the area. Min=0 Max=2147483647 Default=0
SaveWorldEveryMinutes=0

# Non-admins may claim a safehouse.
PlayerSafehouse=false

# Admins may claim a safehouse.
AdminSafehouse=false

# Allow non-members to enter a safehouse.
SafehouseAllowTrepass=true

# A safehouse can take fire damage.
SafehouseAllowFire=true

# Allow non-members to take items from a safehouse.
SafehouseAllowLoot=true

# Players respawn in the safehouse they had claimed before dying.
SafehouseAllowRespawn=false

# In-game days a player must survive before claiming a safehouse.
# Min=0 Max=2147483647 Default=0
SafehouseDaySurvivedToClaim=0

# Players lose safehouse membership after this many real-life hours without
# visiting it. Min=0 Max=2147483647 Default=144
SafeHouseRemovalTime=144

# Allow non-residential buildings to be claimed.
SafehouseAllowNonResidential=false

SafehouseDisableDisguises=true

# Min=0 Max=2147483647 Default=20000
MaxSafezoneSize=20000

# World objects can be destroyed with a sledgehammer.
AllowDestructionBySledgehammer=true

# Restrict destruction to the player's own safehouse.
# Requires AllowDestructionBySledgehammer=true.
SledgehammerOnlyInSafehouse=false

War=false

# Seconds before a war starts. Min=60 Max=2147483647 Default=600
WarStartDelay=600

# War duration in seconds. Min=60 Max=2147483647 Default=3600
WarDuration=3600

# Hit points of a safehouse during war. Min=0 Max=2147483647 Default=3
WarSafehouseHitPoints=3

# Written into the client player files so that saves from singleplayer or from
# another server cannot be reused here.
ServerPlayerID=283006194

# Port for RCON, the remote console. Min=0 Max=65535 Default=27015
RCONPort=27015

# RCON password. Choose a strong one.
RCONPassword=

# Mirror the global text chat into a Discord channel.
DiscordEnable=false

# Discord bot access token.
DiscordToken=

# Name of the Discord chat channel.
DiscordChatChannel=

# Name of the Discord log channel.
DiscordLogChannel=

# Name of the Discord command channel.
DiscordCommandChannel=

# Slack webhook URL.
WebhookAddress=

# Password players need in order to join the server.
Password=

# Limit how many accounts one Steam user may create on this server. Ignored on
# Steam-hosted servers. Min=0 Max=2147483647 Default=0
MaxAccountsPerUser=0

# Allow co-op and split-screen players.
AllowCoop=true

# Players may sleep at any time.
SleepAllowed=false

# Players get tired and need to sleep. Ignored when SleepAllowed=false.
SleepNeeded=false

# Work in progress. Enabling this can cause visual desync of player positions.
KnockedDownAllowed=false

SneakModeHideFromOtherPlayers=true

UltraSpeedDoesnotAffectToAnimals=false

# Workshop mod IDs the server downloads, separated by semicolons.
# Example: WorkshopItems=514427485;513111049
WorkshopItems=

# Show Steam names and avatars in the player list. On: true, off: false,
# admins only: admin
SteamScoreboard=false

# Enable the Steam VAC system.
SteamVAC=true

# Try to set up port forwarding automatically on a UPnP-capable gateway.
UPnP=true

# Enable voice chat.
VoiceEnable=true

# Minimum distance in tiles over which voice chat is audible.
# Min=0.00 Max=100000.00 Default=10.00
VoiceMinDistance=10.0

# Maximum distance in tiles over which voice chat is audible.
# Min=0.00 Max=100000.00 Default=100.00
VoiceMaxDistance=100.0

# Directional audio for voice chat.
Voice3D=true

# Min=10.00 Max=150.00 Default=70.00
SpeedLimit=70.0

LoginQueueEnabled=false

# Min=20 Max=1200 Default=60
LoginQueueConnectTimeout=60

# IP address the server is reachable under. For setups with several addresses,
# such as server farms.
server_browser_announced_ip=

# Players may respawn where they died.
PlayerRespawnWithSelf=false

# Players may respawn next to a split-screen partner.
PlayerRespawnWithOther=false

# How fast time passes while everyone is asleep.
# Min=1.00 Max=100.00 Default=40.00
FastForwardMultiplier=40.0

# A safehouse behaves like an ordinary house while its owner is online, so it is
# only protected when the owner is offline.
DisableSafehouseWhenOwnerConnected=false

# Allow players to form factions.
Faction=true

# Days a player must survive before creating a faction.
# Min=0 Max=2147483647 Default=0
FactionDaySurvivedToCreate=0

# Members required before a faction owner can create a tag.
# Min=1 Max=2147483647 Default=1
FactionPlayersRequiredForTag=1

# Disable radio broadcasts from players of any access level.
DisableRadioStaff=false

# Disable radio broadcasts from players with access level 'admin'.
DisableRadioAdmin=true

# Disable radio broadcasts from players with access level 'gm'.
DisableRadioGM=true

# Disable radio broadcasts from players with access level 'overseer'.
DisableRadioOverseer=false

# Disable radio broadcasts from players with access level 'moderator'.
DisableRadioModerator=false

# Disable radio broadcasts from invisible players.
DisableRadioInvisible=true

# Semicolon-separated list of commands kept out of the cmd.txt server log.
# -vehicle.* excludes every vehicle command, +vehicle.installPart logs that one.
ClientCommandFilter=-vehicle.*;+vehicle.damageWindow;+vehicle.fixPart;+vehicle.installPart;+vehicle.uninstallPart

# Semicolon-separated list of actions written to the ClientActionLogs.txt log.
ClientActionLogs=ISEnterVehicle;ISExitVehicle;ISTakeEngineParts;

# Record changes to player perk levels in the PerkLog.txt server log.
PerkLogs=true

# Maximum number of items per container. 0 means no limit.
# Min=0 Max=9000 Default=0
ItemNumbersLimitPerContainer=0

# Days before old blood splatter is removed. Removal happens when map chunks are
# loaded. 0 means never. Min=0 Max=365 Default=0
BloodSplatLifespanDays=0

# Allow non-ASCII characters, Cyrillic and others, in user names.
AllowNonAsciiUsername=false

BanKickGlobalSound=true

# When true, HoursForCorpseRemoval also removes player corpses.
RemovePlayerCorpsesOnCorpseRemoval=false

# Allow the 'delete all' button on bins.
TrashDeleteAll=false

# Allow a player to strike while being hit by another player.
PVPMeleeWhileHitReaction=false

# Player names are only shown while the mouse hovers over the character.
MouseOverToSeeDisplayName=true

# Player characters outside the field of view disappear, the way zombies do.
HidePlayersBehindYou=true

# Damage multiplier for PvP melee attacks. Min=0.00 Max=500.00 Default=30.00
PVPMeleeDamageModifier=30.0

# Damage multiplier for PvP firearm attacks. Min=0.00 Max=500.00 Default=50.00
PVPFirearmDamageModifier=50.0

# Range in which running cars attract zombies. Lower values can reduce server lag.
# Min=0.00 Max=10.00 Default=0.50
CarEngineAttractionModifier=0.5

# Players push each other when walking into one another.
PlayerBumpPlayer=false

# How other players are shown on the in-game map. Min=1 Max=4 Default=1
MapRemotePlayerVisibility=1

# Min=1 Max=300 Default=5
BackupsCount=5

BackupsOnStart=true

BackupsOnVersionChange=true

# Min=0 Max=1500 Default=0
BackupsPeriod=0

# Disable towing of vehicles.
DisableVehicleTowing=false

# Disable towing of trailers.
DisableTrailerTowing=false

# Disable towing of burnt-out vehicles.
DisableBurntTowing=false

# Path to a file listing forbidden words, one word per line.
BadWordListFile=

# Path to a file listing words that stay allowed even when they contain a
# forbidden word, one word per line.
GoodWordListFile=

# Reaction to a forbidden word in chat.
# 1 = ban, 2 = kick, 3 = log the violation in the database, 4 = mute
BadWordPolicy=3

# Text or symbol that replaces a forbidden word.
BadWordReplacement=[HIDDEN]

# Anti-cheat level, general safety checks.
AntiCheatSafety=2

# Anti-cheat level for character movement speed.
AntiCheatSpeed=2

# Anti-cheat level for character no-clip.
AntiCheatNoClip=4

# Anti-cheat level for character hits.
AntiCheatHit=2

# Anti-cheat level for packet validation.
AntiCheatPacketException=4

# Anti-cheat level for player permissions.
AntiCheatPermission=2

# Anti-cheat level for player experience.
AntiCheatXP=2

# Anti-cheat level for safehouses.
AntiCheatSafeHouse=2

# Anti-cheat level for player checks.
AntiCheatPlayer=2

# Anti-cheat level for checksums.
AntiCheatChecksum=2

# Update rate of the multiplayer statistics in seconds. 0 disables them.
# Min=0 Max=10 Default=1
MultiplayerStatisticsPeriod=1

# Disable the scoreboard.
DisableScoreboard=false

# Hide admins in the player list.
HideAdminsInPlayerList=false

# Limit of network packets processed per client. Min=100 Max=1000 Default=300
MaxPacketsPerSecond=300

# Show the character's coordinates in the bottom right corner.
ShowCoordinates=false

# Seed used for world generation.
# To change it, enter a new value and delete map_worldgen.bin in the save folder.
Seed=IzuPSmICXslxIhQM

UsePhysicsHitReaction=false

# Min=64 Max=1024 Default=200
ChatMessageCharacterLimit=200

# ===========================================================
# ------------------- START USER SETTINGS -------------------

# ----- PASSWORD SETTINGS -----------------------------------
# server admin password
PZ_SERVER_ADMIN_PASSWORD=changeme
# server RCON password
PZ_SERVER_RCON_PASSWORD=changeme

# ----- NETWORK SETTINGS ------------------------------------
# udp connection server port
PZ_SERVER_PORT=16261
# second udp port
PZ_UDP_PORT=16262
# RCON port
PZ_RCON_PORT=27015

# ----- SYSTEM SETTINGS -------------------------------------
# installation directory of the server
PZ_SERVER_INSTALL_DIR=/opt/pzserver
# Linux user that runs the server, set by gamemaster
PZ_SERVER_USER=
# Steam branch of the server, set by gamemaster
PZ_SERVER_BRANCH=

# ----- SERVICE HOOKS ---------------------------------------
# Extra commands for the systemd service of this server. They are written
# into the unit whenever it is written: by 'zomboid world init', 'zomboid
# world switch' and 'zomboid service'. Number them from 1 to add more of a
# kind; they run in that order, the ExecStartPre ones after GameMaster's own.
#
# A command starts with the absolute path of the program, which may be
# preceded by:
#   +  run it as root instead of as the server user
#   -  a failure does not keep the server from starting
#
# A command run as root must belong to root and be writable by root alone,
# and so must every directory above it. Put such scripts below
# /etc/gamemaster/hooks/ - never in the home of the server user, where the
# server user could replace them.
#
# Settings from above can be passed on: $PZ_SERVER_PORT, $PZ_UDP_PORT, ...
#
#PZ_EXEC_START_PRE_1=+/etc/gamemaster/hooks/setup-snat.sh $PZ_SERVER_PORT $PZ_UDP_PORT
#PZ_EXEC_START_POST_1=
#PZ_EXEC_STOP_POST_1=

# -------------------- USER SETTINGS END --------------------
# ===========================================================


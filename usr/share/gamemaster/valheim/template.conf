# ===========================================================
# ------------------- START USER SETTINGS -------------------

# ----- SERVER SETTINGS -------------------------------------
# name of the server in the server list
VH_SERVER_NAME=GameMaster Valheim
# password the players join with: at least 5 characters, and not part of
# the name of the server. Do not use '$' in the name or the password: in
# this file, $NAME stands for the setting NAME.
VH_SERVER_PASSWORD=changeme
# 1: shown in the server list, 0: only joinable by address
VH_SERVER_PUBLIC=1
# 1: Crossplay backend (PlayFab), so players from every platform can join
# and no port has to be forwarded; 0: Steam only
VH_CROSSPLAY=0

# ----- NETWORK SETTINGS ------------------------------------
# udp port the players connect to; the server uses the next one as well
VH_SERVER_PORT=2456

# ----- SAVING ----------------------------------------------
# Left empty, the server keeps its own defaults, given in brackets.
# seconds between two saves of the world [1800]
VH_SAVE_INTERVAL=
# number of automatic backups kept [4]
VH_BACKUPS=
# seconds until the first backup [7200]
VH_BACKUP_SHORT=
# seconds between the backups after it [43200]
VH_BACKUP_LONG=

# ----- SYSTEM SETTINGS -------------------------------------
# installation directory of the server
VH_SERVER_INSTALL_DIR=/opt/valheim
# Linux user that runs the server, set by gamemaster
VH_SERVER_USER=
# Steam branch of the server, set by gamemaster
VH_SERVER_BRANCH=

# ----- SERVICE HOOKS ---------------------------------------
# Extra commands for the systemd service of this server. They are written
# into the unit whenever it is written: by 'valheim world create', 'valheim
# world switch' and 'valheim service'. Number them from 1 to add more of a
# kind; they run in that order, the ExecStartPre ones after GameMaster's own.
#
# A command starts with the absolute path of the program, which may be
# preceded by:
#   +  run it as root instead of as the server user
#   -  a failure does not keep the server from starting
#
# A command run as root must belong to root and be writable by root alone,
# and so must every directory above it. Put such scripts below
# /etc/gamemaster/hooks/ - never in the home of the server user, where the
# server user could replace them.
#
# Settings from above can be passed on: $VH_SERVER_PORT, ...
#
#VH_EXEC_START_PRE_1=+/etc/gamemaster/hooks/setup-firewall.sh $VH_SERVER_PORT
#VH_EXEC_START_POST_1=
#VH_EXEC_STOP_POST_1=

# -------------------- USER SETTINGS END --------------------
# ===========================================================

# ===========================================================
# Rules of a Valheim world, written by 'valheim world create'.
#
# Valheim does not read this file. GameMaster does, every time it writes
# the service of the server ('valheim world init', 'valheim world switch',
# 'valheim service'), and hands the rules to the server when it starts.
# What stands here applies; a change applies from the next start.
#
# Left empty, a rule keeps the default of Valheim.
# ===========================================================

# ----- PRESET ----------------------------------------------
# All rules at once. The single rules below change it further.
# normal, casual, easy, hard, hardcore, immersive, hammer
VH_PRESET=

# ----- RULES -----------------------------------------------
# How hard the fights are: veryeasy, easy, hard, veryhard
VH_COMBAT=
# What a player loses on death: casual, veryeasy, easy, hard, hardcore
VH_DEATHPENALTY=
# How much a resource gives: muchless, less, more, muchmore, most
VH_RESOURCES=
# How often enemies raid a base: none, muchless, less, more, muchmore
VH_RAIDS=
# What may be taken through a portal: casual, hard, veryhard
VH_PORTALS=

# ----- SWITCHES --------------------------------------------
# 1 turns it on, 0 leaves it off
# building costs nothing
VH_NOBUILDCOST=0
# events depend on the players, not on the world
VH_PLAYEREVENTS=0
# enemies do not attack first
VH_PASSIVEMOBS=0
# there is no map
VH_NOMAP=0
